name: Daily Blog Journalist

on:
  schedule:
    - cron: '0 8 * * *' # Runs at 08:00 UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  write-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install rss-parser
        
      - name: Run Journalist Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node scripts/journalist.mjs
        
      - name: Commit and Push
        run: |
            git config --global user.name "NAVAI Blog Bot"
            git config --global user.email "bot@navaitech.com"
            git add src/content/blog/*.md
            git commit -m "feat: daily maritime news update [skip ci]" || echo "No changes to commit"
            git push

      - name: Build Website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name navai-maritime
